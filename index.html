<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiber Optik</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#080f1e;color:white}
.hero{height:75vh;background:linear-gradient(rgba(0,0,0,0.2),#080f1e),url('fiber.jpg');background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center}
.card{max-width:500px;margin:20px auto;background:#121e36;border:1px solid #1e335f;border-radius:20px;padding:25px}
input,select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #2a4a7f;background:#080f1e;color:white}
button{width:100%;padding:14px;background:#8ab4ff;border:none;border-radius:12px;font-weight:800;font-size:1.1rem;cursor:pointer}
#sonucAlani{margin-top:15px;padding:12px;background:#080f1e;border-radius:10px;min-height:50px;font-weight:bold;border:1px dashed #2a4a7f}
</style>
</head>
<body>

<div class="hero">
<div>
<h1>Fiber Optik Haberleşme ve YZ</h1>
<br>
<a href="#hesap" style="background:#6aa6ff;color:black;padding:12px 25px;border-radius:25px;text-decoration:none;font-weight:bold">Projeyi İncele</a>
</div>
</div>

<div id="hesap" class="card">
<h2>🚀 Projelerim - Hesaplayıcı</h2>
<input id="mesafe" type="number" value="3010">
<select id="mod">
<option value="0.35">Single Mode (0.35 dB/km)</option>
<option value="0.2">Long Haul (0.2 dB/km)</option>
<option value="2.5">Multi Mode (2.5 dB/km)</option>
</select>
<button onclick="hesapYap()">Hesapla</button>
<div id="sonucAlani">Sonuç burada görünecek...</div>
</div>

<script>
function hesapYap() {
  var m = parseFloat(document.getElementById("mesafe").value);
  var k = parseFloat(document.getElementById("mod").value);
  var sonucDiv = document.getElementById("sonucAlani");

  if (isNaN(m)) {
    sonucDiv.innerHTML = "Lütfen mesafe girin!";
    return;
  }

  var toplam = m * k;
  var mesaj = "Toplam Kayıp: " + toplam.toFixed(1) + " dB<br>";
  
  if (toplam > 30) {
    mesaj += "<span style='color:#fbbf24'>⚠️ Güçlendirici gerekli!</span>";
  } else {
    mesaj += "<span style='color:#4ade80'>✅ Sinyal iyi</span>";
  }
  
  sonucDiv.innerHTML = mesaj;
}
</script>

</body>
</html>
